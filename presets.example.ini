; Optional. Copy this file to "presets.ini" (next to start.bat) and edit it.
; The launcher works without it: llama.cpp then picks the context length itself.
;
; Precedence: command line > [model section] > [*] global section.
; The section name must equal the model name shown in the Web UI drop-down
; (the folder name under models\, or the .gguf file name without extension).
; Every model section needs a "model =" line (and "mmproj =" for vision models).
; Paths are relative to the launcher folder; use forward slashes.

version = 1

[*]
ctx-size = 0

[MyModel]
model = ./models/MyModel/MyModel-Q4_K_M.gguf
; Delete the next line if the model has no vision support
mmproj = ./models/MyModel/mmproj-F16.gguf
ctx-size = 32768
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
presence-penalty = 1.0
